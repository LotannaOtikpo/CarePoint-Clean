<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Accent Gradient for Heartbeat/Logo -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Grid Overlay for Tech Vibe -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Decorative Glowing Orb -->
  <circle cx="950" cy="315" r="250" fill="#2563eb" opacity="0.12" filter="url(#glow)" />

  <!-- Central Content Layout -->
  <g transform="translate(100, 160)">
    
    <!-- Brand Mark / Icon Box -->
    <g transform="translate(0, 0)">
      <rect width="80" height="80" rx="20" fill="url(#blueGrad)" opacity="0.2" />
      <rect x="5" y="5" width="70" height="70" rx="16" fill="url(#blueGrad)" />
      <!-- Heartbeat Path -->
      <path d="M50 40 h-10 l-4 12 l-8 -24 l-6 16 h-10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(1, 4)" />
    </g>

    <!-- Subtitle / Eyebrow -->
    <text x="0" y="135" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4">APEX HEALTH TECHNOLOGIES</text>

    <!-- Main Title -->
    <text x="0" y="210" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">CarePoint Workspace</text>

    <!-- Description -->
    <text x="0" y="270" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400">A secure hospital operations workspace for connected patient care.</text>
  </g>

  <!-- Bottom Security Footer Indicator -->
  <g transform="translate(100, 500)">
    <rect width="210" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="20" r="5" fill="#34d399" />
    <text x="38" y="25" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Secure Operations</text>
  </g>
</svg>
